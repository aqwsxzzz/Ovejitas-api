services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ovejitas
      POSTGRES_USER: ovejitas
      POSTGRES_PASSWORD: ovejitas
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "port=5433"]
    ports:
      - "5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovejitas -d ovejitas -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: .env
    ports:
      - "7777:7777"
    volumes:
      - .:/app
      - app_venv:/app/.venv
    command:
      - sh
      - -c
      - "alembic upgrade head && exec uvicorn ovejitas.main:app --host 0.0.0.0 --port 7777 --reload --reload-dir /app/src"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7777/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  app_venv:
