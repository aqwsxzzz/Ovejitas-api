services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ovejitas
      POSTGRES_USER: ovejitas
      POSTGRES_PASSWORD: ovejitas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovejitas -d ovejitas"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    env_file: .env
    ports:
      - "7777:8000"
    volumes:
      - ./src:/app/src:ro
    command:
      - uvicorn
      - ovejitas.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
