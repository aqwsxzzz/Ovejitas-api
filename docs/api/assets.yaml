tag: assets
operations:
- method: GET
  path: /api/v1/farms/{farm_id}/assets
  summary: List assets in a farm
  responses: {'200': Page_AssetRead_, '422': HTTPValidationError}
- method: POST
  path: /api/v1/farms/{farm_id}/assets
  summary: Create an asset in a farm
  body: AssetCreate
  responses: {'201': AssetRead, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/assets/summary
  summary: Count assets per kind in a farm
  responses: {'200': AssetSummary, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/assets/{asset_id}
  summary: Get one asset
  description: Resolves archived assets too, so history views can still name them.
  responses: {'200': AssetRead, '422': HTTPValidationError}
- method: PATCH
  path: /api/v1/farms/{farm_id}/assets/{asset_id}
  summary: Update an asset
  description: Set `archived_at` to retire the asset; set it to null to bring it back.
  body: AssetUpdate
  responses: {'200': AssetRead, '422': HTTPValidationError}
- method: DELETE
  path: /api/v1/farms/{farm_id}/assets/{asset_id}
  summary: Delete an asset
  description: Refused with 409 once anything records the asset — a harvest, a feed consumption, a purchase, a product's pool.
    Archive it instead; `deletable` on the asset says up front which of the two applies.
  responses: {'204': any, '409': any, '422': HTTPValidationError}
types:
  AssetCreate:
    kind: object
    required: [name, kind]
    fields:
      name: string
      kind: animal | crop | equipment | material | produce | location
      mode: aggregated | individual | null
      location_asset_id: integer | null
      description: string | null
      gestation_days: integer | null
  AssetKindCount:
    kind: object
    required: [kind, count]
    fields:
      kind: animal | crop | equipment | material | produce | location
      count: integer
  AssetRead:
    kind: object
    required: [id, farm_id, name, kind, mode, location_asset_id, description, produce_asset_id, gestation_days, archived_at,
      created_at, updated_at, deletable]
    fields:
      id: integer
      farm_id: integer
      name: string
      kind: animal | crop | equipment | material | produce | location
      mode: aggregated | individual | null
      location_asset_id: integer | null
      description: string | null
      produce_asset_id: integer | null
      gestation_days: integer | null
      archived_at: string (date-time) | null
      created_at: string (date-time)
      updated_at: string (date-time)
      deletable: boolean
  AssetSummary:
    kind: object
    required: [data]
    fields:
      data: AssetKindCount[]
  AssetUpdate:
    kind: object
    fields:
      name: string | null
      kind: animal | crop | equipment | material | produce | location | null
      mode: aggregated | individual | null
      location_asset_id: integer | null
      description: string | null
      produce_asset_id: integer | null
      gestation_days: integer | null
      archived_at: string (date-time) | null
  HTTPValidationError:
    kind: object
    fields:
      detail: ValidationError[]
  PageMeta:
    kind: object
    required: [page, page_size, total, has_next]
    fields:
      page: integer
      page_size: integer
      total: integer
      has_next: boolean
  Page_AssetRead_:
    kind: object
    required: [data, meta]
    fields:
      data: AssetRead[]
      meta: PageMeta
  ValidationError:
    kind: object
    required: [loc, msg, type]
    fields:
      loc: string | integer[]
      msg: string
      type: string
      input: any
      ctx: object
