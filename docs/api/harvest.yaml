tag: harvest
operations:
- method: POST
  path: /api/v1/farms/{farm_id}/assets/{asset_id}/harvests
  summary: Record a harvest
  description: 'Collects produce from an `animal` or `crop` asset: emits a PRODUCTION event on the source asset and an INVENTORY
    increment on the pool backing the named product (`event_category.produce_asset_id`). `quantity` and `unit` feed both events;
    `unit` must share a measurement family with the product''s unit and match the pool''s existing stock unit. The source
    needs no produce link — the product carries the routing.'
  body: HarvestCreate
  responses: {'201': HarvestRead, '422': HTTPValidationError}
types:
  HTTPValidationError:
    kind: object
    fields:
      detail: ValidationError[]
  HarvestCreate:
    kind: object
    required: [quantity, unit, category_id]
    fields:
      occurred_at: string (date-time)
      quantity: number | string
      unit: g | kg | lb | t | ml | l | gal | unit | dozen | head
      category_id: integer
      notes: string | null
  HarvestRead:
    kind: object
    required: [production_event_id, inventory_event_id, produce_balance]
    fields:
      production_event_id: integer
      inventory_event_id: integer
      produce_balance: string
  ValidationError:
    kind: object
    required: [loc, msg, type]
    fields:
      loc: string | integer[]
      msg: string
      type: string
      input: any
      ctx: object
