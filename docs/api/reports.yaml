tag: reports
operations:
- method: GET
  path: /api/v1/farms/{farm_id}/reports/profitability
  summary: R1 — income minus expense per asset
  description: One row per (asset, currency). Events with NULL amount/currency are excluded. Different currencies are never
    silently summed.
  responses: {'200': ProfitabilityReport, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/profitability-full
  summary: Income minus total cost (direct expense + feed) per (asset, currency)
  description: 'One row per (asset, currency), like R1 — currencies are never summed or converted. Extends R1 with the average-cost
    value of the feed the asset consumed: `net_incl_materials = income - (direct expense + feed)`. Feed is valued in the currency
    of the purchases backing it (a mixed-currency material splits its cost across currency rows in proportion to the quantity
    purchased in each) and uses the same basis as cost-per-unit (R3), so the two never disagree. `has_unvalued_consumption`
    is true only when feed has no purchase basis in ANY currency; such feed contributes no cost. An asset whose sole activity
    is unvalued feed appears once with a null `currency`. The existing `net` (income - direct expense) is retained unchanged.
    `date_from`/`date_to` bound income and direct expense; feed is valued over full purchase history.'
  responses: {'200': ProfitabilityFullReport, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/aggregate
  summary: Generic time-bucketed aggregate over events of one type
  description: 'Dispatches on `type` and returns uniform `{bucket, group, group_label, measure, value, asset_id}` rows.


    - production / observation: SUM(quantity) grouped by unit

    - mortality / acquisition: SUM(quantity) as headcount, no grouping

    - inventory: net flow within window (increments minus decrements).   Pass `adjustment=reset|increment|decrement` to isolate
    one kind.

    - expense / income: SUM(amount) grouped by currency

    - reproductive: COUNT(*) of events


    Filters `unit`, `adjustment`, `currency` are ignored for types where they do not apply.


    **`group_by=asset`** breaks rows down per asset. Each row then carries a stable `group` key (the asset id as a string),
    a `group_label` (the asset name), and an `asset_id`. When `group_by` is omitted, rows are unchanged: `group_label` and
    `asset_id` stay `null`.


    Compatibility matrix — `type` vs `group_by`:


    | type | group_by=asset |

    | --- | --- |

    | mortality | supported |

    | acquisition | supported |

    | production | supported (quantity summed per asset across units) |

    | observation / inventory / expense / income / reproductive | rejected with 422 |'
  responses: {'200': AggregateReport, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/material-consumption-aggregate
  summary: Day/week material-consumption totals, bucketed and grouped
  description: 'Time-bucketed SUM(quantity) over recorded material consumptions.


    - `bucket=day|week|month` — `date_trunc` window

    - `group_by=material|consumer|both` — each row carries a `group` key, a `group_label`, and the `unit` (quantities never
    sum across units)

    - optional filters: `material_asset_id`, `consumer_asset_id`, `reason`, `date_from`, `date_to`


    `totals` carries the per-(group, unit) `total_qty` across all buckets.'
  responses: {'200': MaterialConsumptionAggregateReport, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/cost-per-unit
  summary: R3 — cost per produced unit, per (producer asset, currency)
  description: Requires `unit` (what counts as one produced unit). One row per (producer, currency) — any asset with `production`
    events in that unit; direct expense and feed are never summed across currencies, so a producer with costs in two currencies
    yields two rows. `cost_per_unit = (direct expense events on the producer + the average-cost value of the feed it was fed)
    / its production quantity`, in that row's currency. Feed is attributed via `material_consumption` with `reason=feeding`
    and `consumer_asset_id` = the producer, valued in the currency of the backing purchases (a mixed-currency material splits
    across currency rows); a material's average cost is its full purchase history (not bounded by `date_from`). `date_from`/`date_to`
    bound production and direct expenses. A producer that made nothing in the window still appears with `cost_per_unit` null;
    a producer with no cost in any currency appears once with a null `currency`. `has_unvalued_consumption` flags rows whose
    feed has no purchase history in ANY currency to value it.
  responses: {'200': CostPerUnitReport, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/profitability/pdf
  summary: R1 — PDF download
  responses: {'200': any, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/profitability-full/pdf
  summary: Profitability-full — PDF download
  responses: {'200': any, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/cost-per-unit/pdf
  summary: R3 — PDF download
  responses: {'200': any, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/sales-value
  summary: Realized average sale price per unit, per asset
  description: One row per asset sold via the sale action in the window. `value_per_unit = total sale income / total quantity
    sold` — the weighted-average price actually received (e.g. value per egg), derived from sale events, with no stored unit
    price. Only `material_sale` income and its paired inventory decrements are counted; manually entered income is excluded.
    When an asset was sold in more than one unit in the window, income can't be split across units, so `unit`/`quantity_sold`/`value_per_unit`
    are null and `ambiguous` is true. Assets with no sales in the window do not appear.
  responses: {'200': SalesValueReport, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/production-productivity
  summary: Produced vs expected output, per asset and product
  description: 'One row per (asset, product) that either produced in the window or has an applicable production target. The
    product is a production category; `produced` is converted into the product''s unit. `expected` comes from the target,
    scaled by its `basis` (per_head_continuous uses time-weighted animal-days). A pair with no applicable target reports `missing_capacity:
    true` with null `expected`/`productivity_pct`. `date_from` and `date_to` are **required**.'
  responses: {'200': ProductionProductivityReport, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/inventory-summary
  summary: R5 — current on-hand inventory per asset
  description: 'One row per (asset, unit) for any asset that carries INVENTORY events — material assets and aggregated animal
    flocks. On-hand is derived from those events: sum of increments minus decrements since the most recent reset. `date_to`
    gives the balance as of that moment (default: now); `date_from` does not apply to a running balance and is ignored.'
  responses: {'200': InventorySummaryReport, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/upcoming-births
  summary: Individuals due to give birth within a window
  description: One row per individual whose **latest** pregnancy check says pregnant with an `expected_due_at` inside `[date_from,
    date_to]`. A later not-pregnant check (after birth or loss) suppresses the alert. `date_from` and `date_to` are **required**
    — they define the alert window. `days_until_due` counts whole days from `date_from`.
  responses: {'200': UpcomingBirthsReport, '422': HTTPValidationError}
- method: GET
  path: /api/v1/farms/{farm_id}/reports/individuals/{individual_id}/timeline
  summary: R4 — paginated event timeline for one individual
  responses: {'200': Page_EventRead_, '422': HTTPValidationError}
types:
  AggregateMeta:
    kind: object
    required: [type, measure, bucket, group_key]
    fields:
      type: production | expense | income | observation | reproductive | acquisition | mortality | inventory
      measure: sum_quantity | sum_amount | count
      bucket: day | week | month
      group_key: string | null
      group_by: asset | null
  AggregateReport:
    kind: object
    required: [data, meta]
    fields:
      data: AggregateRow[]
      meta: AggregateMeta
  AggregateRow:
    kind: object
    required: [bucket, group, measure, value]
    fields:
      bucket: string (date-time)
      group: string | null
      group_label: string | null
      measure: sum_quantity | sum_amount | count
      value: string
      asset_id: integer | null
      unit: g | kg | lb | t | ml | l | gal | unit | dozen | head | null
  CostPerUnitReport:
    kind: object
    required: [data, unit]
    fields:
      data: CostPerUnitRow[]
      unit: g | kg | lb | t | ml | l | gal | unit | dozen | head
  CostPerUnitRow:
    kind: object
    required: [asset_id, asset_name, currency, production_quantity, direct_expense_total, consumed_material_cost, total_cost,
      cost_per_unit, has_unvalued_consumption]
    fields:
      asset_id: integer
      asset_name: string
      currency: string | null
      production_quantity: string
      direct_expense_total: string
      consumed_material_cost: string
      total_cost: string
      cost_per_unit: string | null
      has_unvalued_consumption: boolean
  EventRead:
    kind: object
    required: [id, farm_id, asset_id, individual_id, type, category_id, occurred_at, quantity, unit, amount, currency_id,
      adjustment, notes, payload, idempotency_key, created_by, created_at, updated_at]
    fields:
      id: integer
      farm_id: integer
      asset_id: integer
      individual_id: integer | null
      type: production | expense | income | observation | reproductive | acquisition | mortality | inventory
      category_id: integer | null
      occurred_at: string (date-time)
      quantity: string | null
      unit: g | kg | lb | t | ml | l | gal | unit | dozen | head | null
      amount: string | null
      currency_id: integer | null
      adjustment: increment | decrement | reset | null
      notes: string | null
      payload: object
      idempotency_key: string | null
      created_by: integer
      created_at: string (date-time)
      updated_at: string (date-time)
  HTTPValidationError:
    kind: object
    fields:
      detail: ValidationError[]
  InventorySummaryReport:
    kind: object
    required: [data]
    fields:
      data: InventorySummaryRow[]
  InventorySummaryRow:
    kind: object
    required: [asset_id, asset_name, unit, on_hand]
    fields:
      asset_id: integer
      asset_name: string
      unit: g | kg | lb | t | ml | l | gal | unit | dozen | head
      on_hand: string
  MaterialConsumptionAggregateReport:
    kind: object
    required: [data, totals, bucket, group_by]
    fields:
      data: AggregateRow[]
      totals: MaterialConsumptionAggregateTotal[]
      bucket: day | week | month
      group_by: material | consumer | both
  MaterialConsumptionAggregateTotal:
    kind: object
    required: [group, group_label, unit, total_qty]
    fields:
      group: string | null
      group_label: string | null
      unit: g | kg | lb | t | ml | l | gal | unit | dozen | head
      total_qty: string
  PageMeta:
    kind: object
    required: [page, page_size, total, has_next]
    fields:
      page: integer
      page_size: integer
      total: integer
      has_next: boolean
  Page_EventRead_:
    kind: object
    required: [data, meta]
    fields:
      data: EventRead[]
      meta: PageMeta
  ProductionProductivityReport:
    kind: object
    required: [data]
    fields:
      data: ProductionProductivityRow[]
  ProductionProductivityRow:
    kind: object
    required: [asset_id, asset_name, category_id, product_name, unit, produced, expected, productivity_pct, basis, missing_capacity]
    fields:
      asset_id: integer
      asset_name: string
      category_id: integer
      product_name: string
      unit: g | kg | lb | t | ml | l | gal | unit | dozen | head | null
      produced: string
      expected: string | null
      productivity_pct: string | null
      basis: per_head_continuous | per_event | total | null
      missing_capacity: boolean
  ProfitabilityFullReport:
    kind: object
    required: [data, totals]
    fields:
      data: ProfitabilityFullRow[]
      totals: ProfitabilityFullTotal[]
  ProfitabilityFullRow:
    kind: object
    required: [asset_id, asset_name, currency, income_total, direct_expense_total, consumed_material_cost, total_cost, net,
      net_incl_materials, has_unvalued_consumption]
    fields:
      asset_id: integer
      asset_name: string
      currency: string | null
      income_total: string
      direct_expense_total: string
      consumed_material_cost: string
      total_cost: string
      net: string
      net_incl_materials: string
      has_unvalued_consumption: boolean
  ProfitabilityFullTotal:
    kind: object
    required: [currency, income_total, direct_expense_total, consumed_material_cost, total_cost, net, net_incl_materials]
    fields:
      currency: string
      income_total: string
      direct_expense_total: string
      consumed_material_cost: string
      total_cost: string
      net: string
      net_incl_materials: string
  ProfitabilityReport:
    kind: object
    required: [data, totals]
    fields:
      data: ProfitabilityRow[]
      totals: ProfitabilityTotal[]
  ProfitabilityRow:
    kind: object
    required: [asset_id, asset_name, currency, income_total, expense_total, net]
    fields:
      asset_id: integer
      asset_name: string
      currency: string
      income_total: string
      expense_total: string
      net: string
  ProfitabilityTotal:
    kind: object
    required: [currency, income_total, expense_total, net]
    fields:
      currency: string
      income_total: string
      expense_total: string
      net: string
  SalesValueReport:
    kind: object
    required: [data]
    fields:
      data: SalesValueRow[]
  SalesValueRow:
    kind: object
    required: [asset_id, asset_name, currency, income_total, unit, quantity_sold, value_per_unit, ambiguous]
    fields:
      asset_id: integer
      asset_name: string
      currency: string
      income_total: string
      unit: g | kg | lb | t | ml | l | gal | unit | dozen | head | null
      quantity_sold: string | null
      value_per_unit: string | null
      ambiguous: boolean
  UpcomingBirthRow:
    kind: object
    required: [individual_id, individual_tag, asset_id, expected_due_at, offspring_count, days_until_due]
    fields:
      individual_id: integer
      individual_tag: string
      asset_id: integer
      expected_due_at: string (date-time)
      offspring_count: integer | null
      days_until_due: integer
  UpcomingBirthsReport:
    kind: object
    required: [data]
    fields:
      data: UpcomingBirthRow[]
  ValidationError:
    kind: object
    required: [loc, msg, type]
    fields:
      loc: string | integer[]
      msg: string
      type: string
      input: any
      ctx: object
