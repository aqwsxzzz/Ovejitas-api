<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{ title }} — {{ farm_name }}</title>
<style>
  @page { size: A4; margin: 18mm 16mm; }
  body { font-family: "DejaVu Sans", sans-serif; font-size: 10pt; color: #222; }
  header { border-bottom: 1px solid #444; padding-bottom: 8mm; margin-bottom: 8mm; }
  header h1 { margin: 0 0 2mm 0; font-size: 16pt; }
  header .farm { font-size: 11pt; color: #555; }
  header .meta { margin-top: 3mm; font-size: 9pt; color: #777; }
  header .meta span { margin-right: 8mm; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 6mm; }
  thead th { text-align: left; border-bottom: 1px solid #888; padding: 2mm 2mm; font-size: 9pt; text-transform: uppercase; letter-spacing: 0.4pt; color: #555; }
  tbody td { padding: 2mm 2mm; border-bottom: 1px solid #eee; }
  tbody tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  h2 { font-size: 12pt; margin: 6mm 0 3mm 0; }
  .totals { background: #f5f5f5; }
  .totals td { font-weight: 600; }
  footer { position: fixed; bottom: -10mm; left: 0; right: 0; text-align: center; font-size: 8pt; color: #999; }
  footer::before { content: "Pág. " counter(page) " de " counter(pages); }
</style>
</head>
<body>
<header>
  <h1>{{ title }}</h1>
  <div class="farm">{{ farm_name }}</div>
  <div class="meta">
    {% if date_from != "—" or date_to != "—" %}<span>Período: {{ date_from }} — {{ date_to }}</span>{% endif %}
    <span>Generado: {{ generated_at }}</span>
    <span>Por: {{ generated_by }}</span>
  </div>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer></footer>
</body>
</html>
